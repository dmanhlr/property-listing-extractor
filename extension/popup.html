<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 12px;
        font: 13px -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1a1a1a;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr auto;
        row-gap: 3px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .num {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #status {
        font-size: 12px;
        background: #f3f4f6;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 10px;
        min-height: 28px;
        white-space: pre-wrap;
      }
      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      button {
        padding: 7px 8px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #f9fafb;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #scan {
        grid-column: 1 / -1;
        background: #15803d;
        color: #fff;
        border-color: #15803d;
      }
      .foot {
        margin-top: 10px;
        font-size: 10.5px;
        color: #9ca3af;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Property Listing Collector</h1>
    <div class="stats">
      <span>On this tab</span><span class="num" id="page">0</span>
      <span>Collected (unique)</span><span class="num" id="unique">0</span>
      <span>Duplicates skipped</span><span class="num" id="dupes">0</span>
    </div>
    <div id="status" role="status" aria-live="polite">Ready.</div>
    <div class="buttons">
      <button type="button" id="scan">Scan this tab</button>
      <button type="button" id="csv">Export CSV</button>
      <button type="button" id="xlsx">Export XLSX</button>
      <button type="button" id="clear">Clear</button>
    </div>
    <div class="foot">
      Reads the page’s own embedded JSON. Same parser as the in-page panel.
    </div>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
