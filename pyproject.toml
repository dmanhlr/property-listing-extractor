[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listing-extractor"
version = "0.1.0"
description = "Extract listing data from a bot-protected property portal: a Chrome extension for browsing, a Playwright route for volume, one shared parser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["scraping", "chrome-extension", "playwright", "csv", "real-estate"]
dependencies = [
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# The Playwright route is opt-in: it needs an Australian residential proxy to
# reach the live site and it downloads a browser. The demo, tests and the
# extension parser do not need it.
playwright = [
    "playwright==1.48.0",
]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
    "playwright==1.48.0",
    "faker==30.3.0",
]

[project.scripts]
listing-extract = "listing_extractor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/listing_extractor"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# The fixture generator embeds a Markdown document (the fixtures README) as a
# string literal; its table rows are legitimately longer than the code limit.
"scripts/generate_fixtures.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
